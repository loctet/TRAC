<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFS Validator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            background-color: white;
        }
        .card-header {
            background-color: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            padding: 15px 20px;
            font-weight: 600;
        }
        #dafs-input {
            font-family: 'Consolas', monospace;
            min-height: 200px;
            resize: vertical;
        }
        #graph-container {
            width: 100%;
            height: 500px;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            background-color: white;
        }
        .node {
            fill: #69c0ff;
            stroke: #1890ff;
            stroke-width: 2px;
        }
        .link {
            stroke: #999;
            stroke-opacity: 0.6;
        }
        .node text {
            font-size: 12px;
            font-weight: bold;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        #result-container {
            display: none;
        }
        .alert {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">DAFS Validator</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        DAFS Input
                    </div>
                    <div class="card-body">
                        <textarea id="dafs-input" class="form-control" placeholder="Enter your DAFS specification here..."></textarea>
                        <button id="validate-btn" class="btn btn-primary mt-3">Validate DAFS</button>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        Results
                    </div>
                    <div class="card-body">
                        <div id="loading" class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-2">Processing DAFS specification...</p>
                        </div>
                        <div id="result-container">
                            <div id="validation-result"></div>
                            <div id="graph-container"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('validate-btn').addEventListener('click', async () => {
            const dafsText = document.getElementById('dafs-input').value;
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const validationResult = document.getElementById('validation-result');
            const graphContainer = document.getElementById('graph-container');

            if (!dafsText.trim()) {
                alert('Please enter DAFS specification');
                return;
            }

            // Show loading
            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            validationResult.innerHTML = '';
            graphContainer.innerHTML = '';

            try {
                const response = await fetch('http://localhost:5000/api/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ dafs_text: dafsText })
                });

                const data = await response.json();

                // Hide loading
                loading.style.display = 'none';
                resultContainer.style.display = 'block';

                if (data.status === 'error') {
                    validationResult.innerHTML = `
                        <div class="alert alert-danger">
                            <strong>Error:</strong> ${data.message}
                        </div>
                    `;
                } else {
                    validationResult.innerHTML = `
                        <div class="alert alert-success">
                            <strong>Success!</strong> DAFS specification is valid.
                            <img src=${data.graph_data} />
                        </div>
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultContainer.style.display = 'block';
                validationResult.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> Failed to process DAFS specification. Please try again.
                    </div>
                `;
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>
