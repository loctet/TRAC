<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAFSM Validator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f9;
      padding: 30px;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.05);
    }
    .card-header {
      background-color: #e9ecef;
      font-size: 1.25rem;
      font-weight: 600;
      padding: 15px 20px;
    }
    #dafs-input {
      font-family: 'Consolas', monospace;
      min-height: 250px;
      resize: vertical;
    }
    
    #graph-container {
      width: 100%;
      height: 500px;
      border: 1px solid #ced4da;
      border-radius: 5px;
      background-color: white;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .spinner-border {
      width: 3rem;
      height: 3rem;
    }
    .alert {
      margin-top: 20px;
    }
    pre {
      background: #f1f3f5;
      padding: 15px;
      border-radius: 5px;
    }
  </style>
</head>
<body>
<div class="container">
  <h2 class="text-center mb-5">🔍 DAFSM Validator</h2>

  <div class="row">
    <div class="col-lg-6">
      <div class="card mb-4">
        <div class="card-header">DAFSM Specification</div>
        <div class="card-body">
            <div class="mt-3">
                <label for="file-input" class="form-label">Load DAFSM from file:</label>
                <input type="file" class="form-control" id="file-input" accept=".txt,.dafsm,.trac">
            </div>
            
          <textarea id="dafs-input" class="form-control" placeholder="Enter your DAFSM specification here..."></textarea>
          <button id="validate-btn" class="btn btn-primary mt-3 w-100">Validate</button>
        </div>
      </div>
    </div>

    <div class="col-lg-6">
      <div class="card">
        <div class="card-header">Validation Results</div>
        <div class="card-body">
          <div id="loading" class="loading">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3">Processing DAFSM specification...</p>
          </div>

          <div id="result-container" style="display: none;">
            <div id="validation-result"></div>
            <div id="graph-container" class="mt-4"></div>
            <div id="wellformness" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-12">
        <div id="transition-table" class="table"></div>
    </div>
  </div>
</div>

<script>
  document.getElementById('validate-btn').addEventListener('click', async () => {
    const dafsText = document.getElementById('dafs-input').value;
    const loading = document.getElementById('loading');
    const resultContainer = document.getElementById('result-container');
    const validationResult = document.getElementById('validation-result');
    const graphContainer = document.getElementById('graph-container');
    const transitionTable = document.getElementById('transition-table');
    const wellformness = document.getElementById('wellformness');

    if (!dafsText.trim()) {
      alert('Please enter a DAFSM specification');
      return;
    }

    loading.style.display = 'block';
    resultContainer.style.display = 'none';
    validationResult.innerHTML = '';
    graphContainer.innerHTML = '';
    transitionTable.innerHTML = '';
    wellformness.innerHTML = ''

    try {
      const response = await fetch('http://localhost:5000/api/process', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dafs_text: dafsText })
      });

      const data = await response.json();

      loading.style.display = 'none';
      resultContainer.style.display = 'block';

      if (data.status === 'error') {
        validationResult.innerHTML = `
          <div class="alert alert-danger">
            <strong>Error:</strong> ${data.message}
          </div>`;
      } else {

        validationResult.innerHTML = `
          <div class="alert alert-${data.printed_output.indexOf('(!) Verdict: Well-Formed')>=0 ? "success" : "danger"}">
            DAFSM parsed successfully!
            <pre>${data.printed_output}</pre>
          </div>
        `;

        wellformness.innerHTML = ``

        if (data.graph_data) {
          graphContainer.innerHTML = `<img src="${data.graph_data}" class="img-fluid rounded" alt="Graph Visualization"/>`;
        }

        if (data.json_transitions) {
          const j = JSON.parse(data.json_transitions);
          if (j.transitions && j.transitions.length > 0) {
            let table = '<table class="table table-bordered table-striped transition-table">';
            table += '<thead><tr><th>From</th><th>Guard</th><th>Caller</th><th>Role</th><th>Action</th><th>Params</th><th>Assignments</th><th>To</th></tr></thead><tbody>';
            j.transitions.forEach(tr => {
              table += `
                <tr><td colspan="8">${tr.line}</td></tr>
                <tr>
                <td><code style="color:#6c757d;">${tr.from}</code></td>
                <td><code style="color:#d63384;">${tr.preCondition}</code></td>
                <td><code style="color:#0d6efd;">${tr.originInvoker.split(':')[0]}</code></td>
                <td><code style="color:#198754;">${tr.originInvoker.split(':')[1] || ''}</code></td>
                <td><code style="color:#fd7e14;">${tr.actionLabel}</code></td>
                <td><code style="color:#0dcaf0;">${tr.input}</code></td>
                <td><code style="color:#6f42c1;">${tr.postCondition}</code></td>
                <td><code style="color:#6c757d;">${tr.to}</code></td>
              </tr>`;
            });
            table += '</tbody></table>';
            transitionTable.innerHTML = table;
          }
        }
      }
    } catch (error) {
      loading.style.display = 'none';
      resultContainer.style.display = 'block';
      validationResult.innerHTML = `
        <div class="alert alert-danger">
          <strong>Error:</strong> Failed to process DAFSM specification. Please try again.
          <pre>Error: ${error}</pre>
        </div>
      `;
      console.error('Error:', error);
    }
  });
</script>
<script>
    document.getElementById('file-input').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
        document.getElementById('dafs-input').value = e.target.result;
        };
        reader.readAsText(file);
    });
  </script>
</body>
</html>
