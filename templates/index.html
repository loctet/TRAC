<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DAFSM Validator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/viz.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/viz.js/2.1.2/full.render.js"></script>
    <!-- Add CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; padding: 30px; }
        .container { max-width: 1600px; margin: 0 auto; }
        .card { border-radius: 15px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.05); }
        .card-header { background-color: #e9ecef; font-size: 1.25rem; font-weight: 600; padding: 15px 20px; }
        .CodeMirror { font-family: 'Consolas', 'Monaco', 'Courier New', monospace; min-height: 250px; border: 1px solid #ced4da; border-radius: 4px; resize: vertical; overflow: auto !important; }
        #graph-container { width: 100%; height: 500px; border: 1px solid #ced4da; border-radius: 5px; background-color: white; overflow: auto;  }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner-border { width: 3rem; height: 3rem; }
        .alert { margin-top: 20px; }
        pre { background: #f1f3f5; padding: 15px; border-radius: 5px; }
        .cm-dafsm-state { color: #81a1c1; font-weight: bold; }
        .cm-dafsm-guard { color: #bf616a; font-style: italic; }
        .cm-dafsm-party-type { color: #d08770; font-weight: bold; }
        .cm-dafsm-role { color: #b48ead; }
        .cm-dafsm-party { color: #d8dee9; }
        .cm-dafsm-arrow { color: #ebcb8b; font-weight: bold; }
        .cm-dafsm-operation { color: #a3be8c; }
        .cm-dafsm-assignments { color: #88c0d0; }
        .cm-comment { color: #999999; font-style: italic; }
        .cm-dafsm-keyword { color: #18e609; font-weight: bold; }
        .cm-dafsm-header { color: #5E81AC; font-style: italic; }
        .cm-dafsm-param-type { color: #B48EAD; }
        .cm-dafsm-declaration { color: #A3BE8C; }
        .cm-dafsm-assignment { color: #EBCB8B; }
        .cm-dafsm-arrow { color: #EBCB8B; font-weight: bold;}     

    </style>
</head>

<body>
    <div class="container">
        <h2 class="text-center mb-5">🔍 DAFSM Validator</h2>

        <div class="row">
            <div class="col-lg-6">
                <div class="card mb-4">
                    <div class="card-header">DAFSM Specification</div>
                    <div class="card-body">
                        <div class="mt-3">
                            <label for="file-input" class="form-label">Load DAFSM from file:</label>
                            <input type="file" class="form-control" id="file-input" accept=".txt,.dafsm,.trac">
                        </div>

                        <!-- Replace textarea with div that will contain CodeMirror -->
                        <div class="alert alert-info" role="alert">
                            Ctrl-Enter => Validate; Ctrl-D => Download; Ctrl-/ => Comment
                        </div>
                        <div id="dafs-input-container"></div>

                        
                        <div class="btn-group" role="group" aria-label="Basic example">
                            <button id="validate-btn" class="btn btn-primary">Validate</button>
                            <button id="download-btn" class="btn btn-success">Download</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">Validation Results</div>
                    <div class="card-body">
                        <div id="loading" class="loading">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3">Processing DAFSM specification...</p>
                        </div>

                        <div id="result-container" style="display: none;">
                            <div id="validation-result"></div>
                            <div id="graph-container" class="mt-4"></div>
                            <div id="wellformness" class="mt-4"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-12">
                <div id="transition-table" class="table"></div>
            </div>
        </div>
    </div>

    <!-- Add CodeMirror JS files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/comment/comment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/addon/display/autorefresh.min.js"></script>

    <script>
        // Initialize Graphviz renderer
        let viz = new Viz();
        
        function generateDotFromTransitions(transitions, initstates, finalstates) { 
            let dot = 'digraph G {\n';
            dot += '  rankdir=LR;\n';
            dot += '  node [shape=circle, style=filled, fillcolor=white, fontcolor=black, width=0.4, height=0.4, fixedsize=true, fontsize=10, margin=0.05];\n';
            dot += '  edge [fontsize=8];\n\n';
            
            // Collect all unique states from transitions
            const states = new Set();
            transitions.forEach(tr => {
                states.add(tr.from);
                states.add(tr.to);
            });

            // Add nodes with styles based on initial and final states
            states.forEach(state => {
                if (initstates.includes(state)) {
                    // Initial state: white bg, black text, green border
                    dot += `  "${state}" [label="${state}", fillcolor=white, fontcolor=black, color=green, penwidth=3];\n`;
                } else if (finalstates.includes(state)) {
                    // Final state: red bg, white text, default border
                    dot += `  "${state}" [label="${state}", fillcolor=red, fontcolor=white, color=black];\n`;
                } else {
                    // Normal state: white bg, black text, default border
                    dot += `  "${state}" [label="${state}", fillcolor=white, fontcolor=black, color=black];\n`;
                }
            });

            // Add edges
            transitions.forEach(tr => {
                let edgeLabel = `${tr.actionLabel}`;
                // Add edge with tooltip
                dot += `  "${tr.from}" -> "${tr.to}" [label="${edgeLabel}", title="${tr.line}"];\n`;
            });

            dot += '}\n';
            return dot;
        }


        async function renderGraph(transitions, initstates, finalstates) {
            try {
                console.log(initstates, finalstates)
                const dot = generateDotFromTransitions(transitions, initstates, finalstates);
                const graphContainer = document.getElementById('graph-container');
                graphContainer.innerHTML = '';
                
                const result = await viz.renderString(dot, {
                    engine: 'dot',
                    format: 'svg',
                    totalMemory: 100000000
                });
                
                graphContainer.innerHTML = result;
                
                // Add tooltips to nodes and edges
                const svg = graphContainer.querySelector('svg');
                svg.setAttribute('class', 'viz-graph');
                
                // Make the graph responsive
                svg.setAttribute('width', '100%');
                svg.setAttribute('height', '100%');
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                
            } catch (error) {
                console.error('Error rendering graph:', error);
                document.getElementById('graph-container').innerHTML = 
                    '<div class="alert alert-danger">Error rendering graph visualization</div>';
            }
        }
        // Initialize CodeMirror editor
        const editor = CodeMirror(document.getElementById('dafs-input-container'), {
            lineNumbers: true,
            matchBrackets: true,
            autoCloseBrackets: true,
            theme: 'dracula',
            mode: 'text/x-csrc', // Default mode, can be changed later
            indentUnit: 4,
            extraKeys: {
                'Ctrl-Enter': function (cm) {
                    document.getElementById('validate-btn').click();
                },
                'Ctrl-D': function (cm) {
                    document.getElementById('download-btn').click();
                },
                'Ctrl-/': 'toggleComment'
            },
            placeholder: 'Enter your DAFSM specification here...'
        });

        CodeMirror.defineMode("dafsm", function () {
            return {
                token: function (stream, state) {
                    if (stream.eatSpace()) return null;
                    // Comments
                    if (stream.match("//")) {
                        stream.skipToEnd();
                        return "comment";
                    }
                    if (stream.match("/*")) {
                        state.inComment = true;
                        return "comment";
                    }
                    if (state.inComment) {
                        if (stream.skipTo("*/")) {
                            stream.match("*/");
                            state.inComment = false;
                        } else {
                            stream.skipToEnd();
                        }
                        return "comment";
                    }
                    // [q1], [q2+]
                    if (stream.match(/\[\w+\+?\]/)) {
                        return "dafsm-state";
                    }
                    // Guard block: { ... } before the action
                    if (stream.match(/\{[^{}]*\}/)) {
                        return "dafsm-guard";
                    }
                    // Optional party type: new or any
                    if (stream.match(/\b(new|any)\b/)) {
                        return "dafsm-party-type";
                    }
                    // Keywords
                    if (stream.match(/\b(if|dafsm|by|roles)\b/)) {
                        return "dafsm-keyword";
                    }
                    // Types
                    if (stream.match(/\b(int|string|float|array|bool)\b/)) {
                        return "dafsm-keyword";
                    }
                    // Role (starts with uppercase)
                    if (stream.match(/\b[A-Z][a-zA-Z0-9_]*\b/)) {
                        return "dafsm-role";
                    }
                    // Party name (lowercase, right after role)
                    if (stream.match(/\b[a-z][a-zA-Z0-9_]*\b/)) {
                        return "dafsm-party";
                    }
                    // Arrow >
                    if (stream.match(">")) {
                        return "dafsm-arrow";
                    }
                    // Operation and parameters
                    if (stream.match(/\b\w+\s*\([^)]*\)/)) {
                        return "dafsm-operation";
                    }
                    // Variable declaration: int x;
                    if (stream.match(/\b(int|bool|string|float)\s+\w+\s*;/)) {
                        return "dafsm-declaration";
                    }

                    // Assignments inside action
                    if (stream.match(/\{[^{}]*\}/)) {
                        return "dafsm-assignments";
                    }

                    // Assignment: int x := expr;
                    if (stream.match(/\b(int|bool|string|float)\s+\w+\s*:=\s*[^;]+;/)) {
                        return "dafsm-assignment";
                    }

                    // Guard line: if condition
                    if (stream.sol() && stream.match(/if\s+.+/)) {
                        return "dafsm-guard";
                    }
                    // Fallback
                    stream.next();
                    return null;
                },
                startState: function () {
                    return { inComment: false };
                },
                lineComment: "//"
            };
        });

        // Set DAFSM mode by default
        editor.setOption("mode", "dafsm");

        document.getElementById('validate-btn').addEventListener('click', async () => {
            const dafsText = editor.getValue(); // Get value from editor instead of textarea
            console.log(dafsText)
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('result-container');
            const validationResult = document.getElementById('validation-result');
            const graphContainer = document.getElementById('graph-container');
            const transitionTable = document.getElementById('transition-table');
            const wellformness = document.getElementById('wellformness');

            if (!dafsText.trim()) {
                alert('Please enter a DAFSM specification');
                return;
            }

            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            validationResult.innerHTML = '';
            graphContainer.innerHTML = '';
            transitionTable.innerHTML = '';
            wellformness.innerHTML = ''

            try {
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ dafs_text: dafsText })
                });

                const data = await response.json();

                loading.style.display = 'none';
                resultContainer.style.display = 'block';

                if (data.status === 'error') {
                    validationResult.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>Error:</strong> ${data.message}
                    </div>`;
                } else {

                    validationResult.innerHTML = `
                    <div class="alert alert-${data.printed_output.indexOf('(!) Verdict: Well-Formed') >= 0 ? "success" : "danger"}">
                        DAFSM parsed successfully!
                        <pre>${data.printed_output}</pre>
                    </div>
                    `;

                    wellformness.innerHTML = ``

                    /*if (data.graph_data) {
                        graphContainer.innerHTML = `<img src="${data.graph_data}" class="img-fluid rounded" alt="Graph Visualization"/>`;
                    }*/

                    if (data.json_transitions) {
                        const j = JSON.parse(data.json_transitions);
                        if (j.transitions && j.transitions.length > 0) {
                            console.log(j)
                            await renderGraph(j.transitions, [j.initialState], j.finalStates);
                            let table = '<table class="table table-bordered table-striped transition-table">';
                            table += '<thead><tr><th>From</th><th>Guard</th><th>Caller</th><th>Role</th><th>Action</th><th>Params</th><th>Assignments</th><th>To</th></tr></thead><tbody>';
                            j.transitions.forEach(tr => {
                                table += `
                <tr><td colspan="8">${tr.line}</td></tr>
                <tr>
                <td><code style="color:#6c757d;">${tr.from}</code></td>
                <td><code style="color:#d63384;">${tr.preCondition}</code></td>
                <td><code style="color:#0d6efd;">${tr.originInvoker.split(':')[0]}</code></td>
                <td><code style="color:#198754;">${tr.originInvoker.split(':')[1] || ''}</code></td>
                <td><code style="color:#fd7e14;">${tr.actionLabel}</code></td>
                <td><code style="color:#0dcaf0;">${tr.input}</code></td>
                <td><code style="color:#6f42c1;">${tr.postCondition}</code></td>
                <td><code style="color:#6c757d;">${tr.to}</code></td>
              </tr>`;
                            });
                            table += '</tbody></table>';
                            transitionTable.innerHTML = table;
                        }
                    }
                }
            } catch (error) {
                loading.style.display = 'none';
                resultContainer.style.display = 'block';
                validationResult.innerHTML = `
                    <div class="alert alert-danger">
                    <strong>Error:</strong> Failed to process DAFSM specification. Error calling the API.
                    <pre>Error: ${error}</pre>
                    </div>
                `;
                console.error('Error:', error);
            }
        });
    </script>
    <script>
        document.getElementById('file-input').addEventListener('change', function (event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function (e) {
                editor.setValue(e.target.result); // Set editor value instead of textarea
            };
            reader.readAsText(file);
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const dafsText = editor.getValue().trim(); // Get value from editor

            if (!dafsText) {
                alert("The DAFSM specification is empty. Please enter or load content first.");
                return;
            }

            const blob = new Blob([dafsText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            filename = prompt("Enter the filename")

            a.href = url;
            a.download = `${filename}.trac`;
            document.body.appendChild(a);
            a.click();

            // Cleanup
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>

</body>

</html>
